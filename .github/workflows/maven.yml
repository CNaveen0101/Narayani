name: my_pipeline 

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
 build:
   runs-on: myrunner

   steps:

   - name: code-checkout
     uses: actions/checkout@v4

   - name: java-setup
     uses: actions/setup-java@v4
     with:
      distribution: 'temurin' # See 'Supported distributions' for available options
      java-version: '25'

   - name: Set up Maven
     uses: stCarolas/setup-maven@v5
     with:
        maven-version: 3.8.2

   - name: Maven compile
     run: mvn compile

   - name: Unit test
     run: mvn test

   - name: Generate build artifact
     run: mvn clean package

   - name: Upload the artifact
     uses: actions/upload-artifact@v7
     with:
      name: my-application-artifact
      path: /home/ubuntu/actions-runner/_work/Narayani/Narayani/target/narayani-market-1.0.0.jar
            


 codequality:
   runs-on: myrunner
   needs: build

   steps:
   - name: Download Artifact
     uses: actions/download-artifact@v8
     with:
       name: my-application-artifact
       path: /home/ubuntu/actions-runner/_work/Narayani/Narayani/target/narayani-market-1.0.0.jar

   - name: Display structure of downloaded files
     run: ls -R /home/ubuntu/actions-runner/_work/Narayani/Narayani/target/narayani-market-1.0.0.jar

   - name: SonarQube Scan
     uses: SonarSource/sonarqube-scan-action@v8.2.1
     env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
